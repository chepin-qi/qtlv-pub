name: KEY-PROBE-PUB-02 (拍46·qtlv-pub量子钥存在性探·名级)
'on':
  workflow_dispatch:
permissions:
  contents: read
env:
  QRINGS_KEY_64: ${{ secrets.QRINGS_KEY_64 }}
  QRINGS_KEY_128: ${{ secrets.QRINGS_KEY_128 }}
  QUAFU_API_TOKEN: ${{ secrets.QUAFU_API_TOKEN }}
  QUANTUMRINGS_API_KEY_64: ${{ secrets.QUANTUMRINGS_API_KEY_64 }}
  ORIGINQC_API_KEY: ${{ secrets.ORIGINQC_API_KEY }}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          python3 - <<'PYEOF'
          import os, json
          cands=['QRINGS_KEY_64','QRINGS_KEY_128','QUAFU_API_TOKEN','QUANTUMRINGS_API_KEY_64','ORIGINQC_API_KEY']
          print(json.dumps({'repo':'qtlv-pub','present':{c:bool(os.environ.get(c)) for c in cands}},ensure_ascii=False))
          PYEOF
